 x="210" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="start">Los tres caminos —API, reprogramación y asistente— pasan por aquí.</text><rect x="60" y="446" width="900" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="86" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">models / schemas</text><text x="280" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="start">Entidades del ORM y contratos validados</text><line x1="300" y1="526" x2="300" y2="595" stroke="#475569" stroke-width="1.8"/><path d="M295,594 L300,604 L305,594 Z" fill="#475569"/><text x="312" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="start">SQLAlchemy</text><text x="312" y="573" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start">PyMySQL</text><line x1="720" y1="526" x2="720" y2="595" stroke="#475569" stroke-width="1.8"/><path d="M715,594 L720,604 L725,594 Z" fill="#475569"/><text x="732" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="start">HTTP local</text><text x="732" y="573" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start">API compatible OpenAI</text><rect x="20" y="606" width="980" height="142" rx="10" fill="#f5f7fa" stroke="#e2e8f0" stroke-width="1"/><text x="42" y="634" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="bold" letter-spacing="1.5" text-anchor="start">INFRAESTRUCTURA LOCAL</text><rect x="120" y="648" width="360" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="146" y="676" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">MySQL 8 · Docker</text><text x="146" y="698" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start">Esquema compartido con discriminador</text><text x="146" y="717" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start">Migraciones versionadas (Alembic)</text><rect x="540" y="648" width="360" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="566" y="676" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">LM Studio · local</text><text x="566" y="698" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start">Qwen 2.5 7B con uso de herramientas</text><text x="566" y="717" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start">Sin salida de datos sanitarios</text></svg>