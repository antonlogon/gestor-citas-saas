<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="768" viewBox="0 0 1020 768"><rect width="1020" height="768" fill="#ffffff"/><rect x="20" y="20" width="980" height="150" rx="10" fill="#f5f7fa" stroke="#e2e8f0" stroke-width="1"/><text x="42" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="bold" letter-spacing="1.5" text-anchor="start">CLIENTES NATIVOS</text><rect x="120" y="62" width="360" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="146" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="start">Escritorio</text><text x="146" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="start">JavaFX 21 · Java · MVC + FXML</text><text x="146" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start">Personal clínico — agenda y pacientes</text><rect x="540" y="62" width="360" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="566" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="start">Móvil</text><text x="566" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Android · Kotlin · Retrofit</text><text x="566" y="135" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start">Paciente — sus citas y asistente</text><line x1="300" y1="154" x2="300" y2="223" stroke="#475569" stroke-width="1.8"/><path d="M295,222 L300,232 L305,222 Z" fill="#475569"/><text x="312" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569" text-anchor="start">REST + JWT</text><text x="312" y="199" font-family="Helvetica Neue, Helvetica, Arial,